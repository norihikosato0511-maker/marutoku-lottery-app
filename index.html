<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎲 役割抽選</title>

<style>
body{
    font-family:sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
}

.container{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.box{
    flex:1;
    min-width:300px;
}

textarea{
    width:100%;
    height:220px;
    padding:10px;
    box-sizing:border-box;
    font-size:16px;
    border-radius:10px;
    border:1px solid #ccc;
}

.actions{
    text-align:center;
    margin-top:20px;
}

button{
    margin:5px;
    padding:12px 18px;
    font-size:16px;
    border:none;
    border-radius:10px;
    background:#1976d2;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#result{
    margin-top:20px;
    background:white;
    padding:20px;
    border-radius:15px;
    min-height:200px;
    white-space:pre-line;
    font-size:18px;
    line-height:1.8;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}
</style>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#1976d2">

</head>
<body>

<h1>🎲 役割抽選</h1>

<div class="container">

    <div class="box">
        <h3>👤 人</h3>
        <textarea id="people" placeholder="佐藤&#10;鈴木&#10;田中"></textarea>
    </div>

    <div class="box">
        <h3>📋 すること</h3>
        <textarea id="tasks" placeholder="司会&#10;発表&#10;書記"></textarea>
    </div>

</div>

<div class="actions">
    <button onclick="startDraw()">🎲 抽選開始</button>
    <button onclick="startDraw()">🔄 再抽選</button>
    <button onclick="copyResult()">📋 コピー</button>
    <button onclick="saveFavorite()">⭐ お気に入り保存</button>
    <button onclick="showHistory()">📜 履歴</button>
    <button onclick="clearAll()">🗑️ クリア</button>
</div>

<div id="result">
結果がここに表示されます
</div>

<script>

function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
    return array;
}

function startDraw(){

    let people=document
        .getElementById("people")
        .value
        .split("\n")
        .map(v=>v.trim())
        .filter(v=>v);

    let tasks=document
        .getElementById("tasks")
        .value
        .split("\n")
        .map(v=>v.trim())
        .filter(v=>v);

    if(!people.length || !tasks.length){
        alert("人とすることを入力してください");
        return;
    }

    let count=0;

    const resultArea=
        document.getElementById("result");

    const roulette=setInterval(()=>{

        let p=[...people];
        let t=[...tasks];

        shuffle(p);
        shuffle(t);

        let text="🎲 抽選中...\n\n";

        const max=Math.min(
            p.length,
            t.length
        );

        for(let i=0;i<max;i++){
            text += `${p[i]} → ${t[i]}\n`;
        }

        resultArea.textContent=text;

        count++;

        if(count>=25){

            clearInterval(roulette);

            finalizeDraw(
                people,
                tasks
            );

        }

    },100);
}

function finalizeDraw(people,tasks){

    people=[...people];
    tasks=[...tasks];

    shuffle(people);
    shuffle(tasks);

    let text="🎉 抽選結果\n\n";

    const max=Math.min(
        people.length,
        tasks.length
    );

    for(let i=0;i<max;i++){
        text +=
        `${people[i]} → ${tasks[i]}\n`;
    }

    if(people.length>tasks.length){

        text +=
        "\n【未割当の人】\n";

        for(let i=max;i<people.length;i++){
            text += people[i] + "\n";
        }
    }

    if(tasks.length>people.length){

        text +=
        "\n【未割当のすること】\n";

        for(let i=max;i<tasks.length;i++){
            text += tasks[i] + "\n";
        }
    }

    document.getElementById("result")
        .textContent=text;

    saveHistory(text);
}

function copyResult(){

    const text=
        document.getElementById("result")
        .textContent;

    navigator.clipboard
        .writeText(text);

    alert("コピーしました");
}

function saveFavorite(){

    const data={
        people:
            document.getElementById("people").value,
        tasks:
            document.getElementById("tasks").value
    };

    localStorage.setItem(
        "lotteryFavorite",
        JSON.stringify(data)
    );

    alert("お気に入り保存しました");
}

function saveHistory(result){

    let history=JSON.parse(
        localStorage.getItem("lotteryHistory")
        || "[]"
    );

    history.unshift({
        date:new Date().toLocaleString(),
        result:result
    });

    history=history.slice(0,20);

    localStorage.setItem(
        "lotteryHistory",
        JSON.stringify(history)
    );
}

function showHistory(){

    const history=JSON.parse(
        localStorage.getItem("lotteryHistory")
        || "[]"
    );

    if(history.length===0){
        alert("履歴はありません");
        return;
    }

    let text="";

    history.forEach(item=>{

        text +=
            item.date +
            "\n" +
            item.result +
            "\n------------------\n\n";

    });

    alert(text);
}

function clearAll(){

    if(!confirm("入力内容を削除しますか？")){
        return;
    }

    document.getElementById("people").value="";
    document.getElementById("tasks").value="";

    document.getElementById("result").textContent=
        "結果がここに表示されます";
}

window.onload=()=>{

    const favorite=
        localStorage.getItem(
            "lotteryFavorite"
        );

    if(favorite){

        const data=
            JSON.parse(favorite);

        document.getElementById("people").value=
            data.people || "";

        document.getElementById("tasks").value=
            data.tasks || "";
    }
};

if ("serviceWorker" in navigator) {

  window.addEventListener("load", () => {

    navigator.serviceWorker
      .register("./service-worker.js")
      .then(() => {
        console.log("Service Worker登録完了");
      })
      .catch(err => {
        console.error(err);
      });

  });

}

</script>

</body>
</html>
